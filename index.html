<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme) {
        document.documentElement.dataset.theme = savedTheme;
      }
    </script>
    <title>MyNotes</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="mynotes-header">
      <h1>MyNotes</h1>
      <div class="menubuttons">
        <button class="add-note-btn" onclick="openNoteDialog()">
          + New Note
        </button>
        <button id="theme-toggle">Theme</button>
      </div>
    </header>
    <main></main>

    <dialog id="noteDialog" closedby="any">
      <div class="dialog-content">
        <header class="dialog-header">
          <h2 id="dialogTitle">Add New Note</h2>
          <button class="close-dialog" onclick="closeNoteDialog()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-x preview-icon"
            >
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </header>
        <form id="noteForm">
          <div class="form-group">
            <label class="form-label"
              >Title
              <input
                type="text"
                id="noteTitle"
                class="form-input"
                placeholder="Enter note title..."
                required
              />
            </label>
          </div>
          <div class="form-group">
            <label class="form-label"
              >Content
              <textarea
                id="noteContent"
                class="form-textarea"
                placeholder="Write your note..."
                required
              ></textarea>
            </label>
          </div>
          <div class="dialog-actions">
            <button
              type="button"
              class="cancel-btn"
              onclick="closeNoteDialog()"
            >
              Cancel
            </button>
            <button type="submit" class="save-btn">Save Note</button>
          </div>
        </form>
      </div>
    </dialog>
  </body>
</html>
